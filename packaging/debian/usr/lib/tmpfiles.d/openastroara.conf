# Runtime directory for openastroara-server (sequence locks per §34.7,
# socket files, transient state). Recreated on boot by systemd-tmpfiles.
d /var/run/openastroara 0750 openastroara openastroara -
# ASTAP star database directory (§18.I): the daemon passes it to astap_cli with -d.
# Created service-user-owned so the DEPLOY.md download step needs no chown and the
# files are readable by the daemon regardless of the admin's umask.
d /var/lib/astap 0755 openastroara openastroara -
