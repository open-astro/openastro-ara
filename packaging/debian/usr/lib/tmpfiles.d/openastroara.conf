# Runtime directory for openastroara-server (sequence locks per §34.7,
# socket files, transient state). Recreated on boot by systemd-tmpfiles.
d /run/openastroara 0750 openastroara openastroara -
# §29.1.4 storage requests: the daemon drops <id>.request here and reads back the
# <id>.result that openastroara-storage@.service (root) writes. Daemon-owned so it
# can create and clean up; root needs no permission to write into it.
d /run/openastroara/storage 0750 openastroara openastroara -
# ASTAP star database directory (§18.I): the daemon passes it to astap_cli with -d.
# Created service-user-owned so the DEPLOY.md download step needs no chown and the
# files are readable by the daemon regardless of the admin's umask.
d /var/lib/astap 0755 openastroara openastroara -
# §33 update requests (#1122): same exchange as storage, for openastroara-update@.service.
d /run/openastroara/update 0750 openastroara openastroara -
# Uploaded .deb files are staged here by the daemon. The root helper copies each one into
# /var/lib/openastroara-rollback (root-only, outside every daemon-owned directory so no
# path component can be swapped for a symlink) before dpkg reads it, and keeps the running
# and new versions there for a later rollback.
d /var/lib/openastroara/updates 0750 openastroara openastroara -
d /var/lib/openastroara-rollback 0700 root root -
