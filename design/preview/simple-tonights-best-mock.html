<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Mode: Tonight's Best</title>
<style>
  /* Single dark look on purpose: DESIGN.md tokens (lib/theme/ara_colors.dart), as design/preview/plan-window-mock.html.
     Day / Night here is the app's Night mode: the red luminance fold, applied to the scene only. */
  :root {
    color-scheme: dark;
    --page: #0E0E0E; --bg: #1A1A1A; --border: #404040; --text: #E0E0E0; --text2: #A0A0A0;
    --ok: #4CAF50; --okText: #81C784; --busy: #FFB300; --info: #42A5F5; --sel: #1976D2; --tile: #383838;
    --link: #64B5F6; --stop: #D32F2F; --selbg: rgba(25,118,210,.32); --warnBg: rgba(255,179,0,.12);
    --sys: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 var(--sys); }
  .page { max-width: 1120px; margin: 0 auto; padding: 28px 16px 72px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
  p.note { color: var(--text2); margin: 0; max-width: 84ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lbl { color: var(--text2); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--text); border: 0; min-height: 44px; min-width: 44px; padding: 0 12px; font: 13px var(--sys); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--sel); color: #fff; }
  [hidden] { display: none !important; }
  button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .legend { color: var(--busy); font-size: 12px; }
  .where { color: var(--text2); font-size: 13px; box-shadow: inset 0 0 0 1px rgba(255,179,0,.5); border-radius: 8px; padding: 6px 10px; max-width: 92ch; }
  .where b { color: var(--text); font-weight: 600; }
  .stage { overflow-x: auto; padding-bottom: 6px; }

  /* The device scene */
  .dev { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #333; flex: none; margin: 0 auto;
         background: radial-gradient(ellipse at 35% 45%, #2a2f3a 0, #101217 55%, #07080b 100%); }
  .dev.ipad { width: 1024px; height: 720px; }
  .dev.phone { width: 390px; height: 844px; }
  body.night .dev { filter: sepia(1) saturate(6) hue-rotate(-35deg) brightness(.75); }
  .p { position: absolute; background: rgba(14,14,14,.92); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border); }
  .strip { left: 0; right: 0; top: 0; height: 56px; border-radius: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .strip .grow { flex: 1; min-width: 0; }
  .mark { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--link); flex: none; }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); white-space: nowrap; }
  .dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .warn { color: var(--busy); font-size: 13px; white-space: nowrap; }
  .ic { vertical-align: -2px; flex: none; }
  .ib svg { width: 20px; height: 20px; }
  .ib { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; font-size: 17px; cursor: default; }
  .rail { left: 16px; top: 72px; width: 76px; padding: 8px 6px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .chip { width: 62px; min-height: 52px; border-radius: 8px; background: var(--tile); color: var(--text); border: 0; font: 12px/1.2 var(--sys); padding: 4px 2px; cursor: default; }
  .chip.on { background: var(--sel); color: #fff; }
  .chip.go { cursor: pointer; }
  .rrail { right: 16px; top: 72px; width: 76px; padding: 8px 6px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .shutter { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; background: none; }
  .shutter b { width: 0; height: 0; border-left: 20px solid #fff; border-top: 13px solid transparent; border-bottom: 13px solid transparent; margin-left: 6px; }
  .stop { right: 16px; bottom: 16px; width: 60px; height: 60px; border-radius: 10px; background: var(--stop); color: #fff; font: 700 12px var(--sys); display: grid; place-items: center; border: 0; }
  .hint { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); color: var(--text2); text-align: center; max-width: 320px; }
  .deck { left: 8px; right: 8px; bottom: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .deck .row { display: flex; gap: 8px; align-items: center; }
  .deck .sections { overflow-x: auto; scrollbar-width: none; }
  .deck .sections .chip { flex: none; width: auto; min-width: 64px; padding: 4px 12px; min-height: 44px; }
  .deck .row .chip { min-height: 44px; flex: 1; width: auto; }
  .deck .stop { position: static; margin-left: auto; flex: none; }
  .deck .shutter { flex: none; }

  /* Screen panel */
  .screen { display: flex; flex-direction: column; min-width: 0; overflow: hidden; z-index: 2; }
  .ipad .screen { left: 108px; right: 108px; top: 72px; bottom: 16px; }
  .phone .screen { left: 8px; right: 8px; top: 64px; bottom: 200px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .head h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .head small { display: block; color: var(--text2); font-size: 12px; }
  .head .grow { flex: 1; min-width: 0; }
  .btn { min-height: 44px; border: 0; border-radius: 10px; background: var(--tile); color: var(--text); font: 600 14px var(--sys); cursor: pointer; padding: 6px 14px; white-space: nowrap; }
  .btn.out { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
  .btn.go { background: #1565C0; color: #fff; }
  .btn.amber { background: transparent; color: var(--busy); box-shadow: inset 0 0 0 1.5px var(--busy); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn[aria-pressed="true"] { background: var(--selbg); color: #cfe3fb; box-shadow: inset 0 0 0 1.5px var(--link); }
  .body { display: flex; min-height: 0; flex: 1; }
  .listcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; }
  .bar .r { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .phone .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .fchip { min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--tile); color: var(--text); font: 13px var(--sys); cursor: pointer; white-space: nowrap; flex: none; }
  .fchip[aria-pressed="true"] { background: var(--sel); color: #fff; }
  .count { color: var(--text2); font-size: 12px; }
  .scroll { overflow-y: auto; flex: 1; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .banner { padding: 8px 12px; border-radius: 10px; background: var(--warnBg); box-shadow: inset 0 0 0 1px rgba(255,179,0,.45); color: var(--text); font-size: 13px; }
  .banner b { color: var(--busy); font-weight: 600; }

  /* Row. The .art backgrounds are stand-ins for the catalogue Art (a photograph in the app), not decoration. */
  .row-t { display: grid; grid-template-columns: 56px minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,.9fr) auto; gap: 12px; align-items: center;
           background: var(--tile); border-radius: 12px; padding: 8px 10px; }
  .row-t.sel { background: var(--selbg); box-shadow: inset 0 0 0 1.5px var(--link); }
  .tap { background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; display: block; min-width: 0; }
  .nm { min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .nm b { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .nm .sub { color: #B8B8B8; font-size: 12px; }
  .nm .fit { font-size: 13px; }
  .fit.bad { color: var(--busy); }
  .moon { color: var(--busy); font-size: 12px; }
  .fact { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; }
  .fact small { display: block; color: #B8B8B8; font-size: 12px; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .marks { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border); color: var(--text); white-space: nowrap; }
  .tag.col { box-shadow: inset 0 0 0 1px rgba(76,175,80,.7); color: var(--okText); }
  .tag.q { box-shadow: inset 0 0 0 1px var(--link); color: var(--link); }
  .art { width: 56px; height: 56px; border-radius: 8px; background-color: #0b0d14; flex: none; }
  .art.galaxy { background-image: radial-gradient(ellipse 36% 14% at 50% 50%, rgba(255,230,190,.95) 0 55%, transparent 100%), radial-gradient(circle at 20% 25%, #fff 0 1px, transparent 2px), radial-gradient(circle at 80% 75%, #fff 0 1px, transparent 2px); transform: none; }
  .art.nebula { background-image: radial-gradient(circle at 45% 50%, rgba(255,120,150,.85) 0 10%, rgba(160,80,200,.5) 28%, transparent 55%), radial-gradient(circle at 75% 25%, #fff 0 1px, transparent 2px); }
  .art.cluster { background-image: radial-gradient(circle at 50% 50%, #fff 0 3px, rgba(255,230,160,.6) 8px, transparent 22px), radial-gradient(circle at 30% 70%, #fff 0 1px, transparent 2px), radial-gradient(circle at 70% 30%, #fff 0 1px, transparent 2px), radial-gradient(circle at 62% 68%, #ddd 0 1px, transparent 2px); }
  .art.planetary { background-image: radial-gradient(circle at 50% 50%, transparent 0 8px, rgba(80,220,200,.85) 10px, rgba(60,160,220,.45) 16px, transparent 24px); }
  .art.other { background-image: radial-gradient(circle at 40% 55%, rgba(255,160,90,.6) 0 8%, transparent 40%), radial-gradient(circle at 70% 30%, #fff 0 1px, transparent 2px), radial-gradient(circle at 25% 25%, #fff 0 1px, transparent 2px); }

  .phone .row-t { grid-template-columns: 56px minmax(0,1fr); grid-template-areas: "art name" "facts facts" "acts acts"; row-gap: 6px; }
  .phone .row-t > .art { grid-area: art; }
  .phone .row-t .tap { grid-area: name; }
  .phone .row-t .acts { grid-area: acts; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
  .phone .row-t .facts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; grid-area: facts; }
  .ipad .facts2 { display: contents; }

  /* Side pane (iPad) and sky view */
  .side { width: 288px; flex: none; border-left: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .sky { aspect-ratio: 1; border-radius: 12px; position: relative; background: radial-gradient(circle at 50% 60%, #1c2230 0, #0b0d14 70%); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
  .sky::before { content: ""; position: absolute; left: 0; right: 0; bottom: 18%; border-top: 1px dashed var(--text2); }
  .sky .tgt { position: absolute; left: 56%; top: 34%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; box-shadow: 0 0 0 2px var(--link); }
  .sky .tgt::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--link); }
  .sky span { position: absolute; left: 8px; top: 8px; right: 8px; font-size: 12px; color: var(--text2); }
  .sky em { position: absolute; left: 8px; bottom: 6px; font-size: 12px; font-style: normal; color: var(--text2); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
  .kv small { display: block; color: var(--text2); font-size: 12px; }
  .detail { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }

  .empty { margin: auto; text-align: center; max-width: 320px; padding: 24px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .empty h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .empty p { margin: 0; color: var(--text2); }

  /* Plan sheet */
  .sheet { z-index: 4; display: flex; flex-direction: column; overflow: hidden; }
  .ipad .sheet { right: 108px; top: 72px; bottom: 92px; width: 440px; }
  .phone .sheet { left: 8px; right: 8px; top: 64px; bottom: 200px; }
  .sheet .scroll { gap: 10px; }
  .sect { color: var(--text2); font-size: 12px; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card { display: flex; flex-direction: column; gap: 1px; text-align: left; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: var(--tile); color: var(--text); font: 14px var(--sys); cursor: pointer; min-height: 44px; }
  .card small { color: #B8B8B8; font-size: 12px; }
  .card.sel { background: var(--selbg); box-shadow: inset 0 0 0 1.5px var(--link); }
  .card.sel small { color: #cfe3fb; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .hrs { font-variant-numeric: tabular-nums; color: var(--okText); font-size: 13px; white-space: nowrap; }
  .hero { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 12px; padding: 10px; border-radius: 12px; background: var(--selbg); box-shadow: inset 0 0 0 1.5px var(--link); }
  .hero .art { width: 76px; height: 76px; }
  .hero h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
  .hero .src { color: #cfe3fb; font-size: 12px; }
  .rowline { color: var(--text2); font-size: 13px; }
  .new { outline: 1.5px dashed var(--busy); outline-offset: 3px; border-radius: 10px; }

  /* Status card (messages, no popups) */
  .msg { position: absolute; z-index: 6; left: 108px; top: 64px; max-width: 420px; padding: 10px 12px; border-radius: 10px; background: rgba(14,14,14,.95);
         box-shadow: inset 0 0 0 1px var(--border); display: flex; gap: 8px; font-size: 13px; }
  .phone .msg { left: 12px; right: 12px; max-width: none; top: 62px; }
  .msg i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--ok); flex: none; }
  .msg.warnm i { background: var(--busy); }
  @media (prefers-reduced-motion: no-preference) { .card, .row-t { transition: background .15s; } }
</style>
</head>
