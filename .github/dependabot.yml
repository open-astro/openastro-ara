# Dependabot keeps dependencies — and our SHA-pinned GitHub Actions — current.
#
# CI pins actions to immutable commit SHAs (see .github/workflows/*.yml) for
# supply-chain safety; the cost is that a bare SHA never updates itself.
# Dependabot watches upstream releases and opens grouped PRs that bump versions
# (preserving the SHA pin for actions) so security/bug fixes land without us
# hand-tracking them. One grouped PR per ecosystem per week to avoid a flurry.
version: 2
updates:
  # GitHub Actions used across the workflows (SHA-pinned).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # .NET / NuGet packages (OpenAstroAra.sln and its projects at the repo root).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Pinned to 7.x: FluentAssertions 8+ is commercially licensed (Xceed);
      # see OpenAstroAra.Test.csproj.
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]
      # Pinned to 2.7.x: 3.x is a breaking major the AspNetCore.OpenApi 10.0.x
      # source generator cannot compile against; see OpenAstroAra.Server.csproj.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
      # Pinned to 2.x: 3.0.0 drops SerialPortDevice from modern TFMs;
      # see OpenAstroAra.Equipment.csproj.
      - dependency-name: SharpGIS.NmeaParser
        update-types: ["version-update:semver-major"]
      # Held on the .NET 10 (LTS) line: these packages ship with each .NET
      # release, and an 11.x one on the net10.0 server mixes runtime lines
      # (Microsoft.Data.Sqlite 11 also swaps the bundled native SQLite).
      # Move them in the same PR that retargets the server to .NET 11.
      - dependency-name: Microsoft.AspNetCore.OpenApi
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.EntityFrameworkCore.Sqlite
        update-types: ["version-update:semver-major"]
      - dependency-name: System.Configuration.ConfigurationManager
        update-types: ["version-update:semver-major"]
      - dependency-name: System.Drawing.Common
        update-types: ["version-update:semver-major"]
      - dependency-name: System.IO.Ports
        update-types: ["version-update:semver-major"]

  # Flutter / Dart client packages.
  #
  # NOTE: this covers pub *packages* only. Dependabot has no Flutter-SDK
  # ecosystem, so the SDK pin itself (client/openastroara_client/.flutter-version
  # + pubspec.yaml's environment block) is watched by
  # .github/workflows/check-flutter.yml instead — see playbook §12.1.
  - package-ecosystem: pub
    directory: /client/openastroara_client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      pub:
        patterns:
          - "*"

  # Git submodules under third_party/. Dependabot moves a submodule to the tracked
  # branch's head, not to a release tag.
  # - ERFA + SuperNOVAS (built into the daemon's natives): each bump PR is gated by
  #   the astrometry tests (NovasEphemerisAgreementTest, NovasAbiTest,
  #   AstrometryNativeTransformTest).
  # - ASTAP (open-astro/astap branch `ara`, built into astap_cli): the branch only
  #   moves when we merge Han Kleijn's updates into it (OPENASTRO.md there), so a bump
  #   PR follows a sync that was already checked against Han's build; CI builds it,
  #   smoke-tests -h in the image and solves a fixture frame (astap-solve job).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      astrometry-sources:
        patterns:
          - "third_party/erfa"
          - "third_party/supernovas"
      astap-solver:
        patterns:
          - "third_party/astap"

  # The .NET SDK pin in global.json (feature-band roll-forward is in the file;
  # this bumps the pinned version itself).
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Android Gradle plugin, Kotlin and the Gradle wrapper for the Flutter client.
  - package-ecosystem: gradle
    directory: /client/openastroara_client/android
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      gradle:
        patterns:
          - "*"

  # Base image in the arm64 server Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      docker:
        patterns:
          - "*"

  # The DESIGN.md linter pinned in tools/design-lint (run by the sanity job).
  - package-ecosystem: npm
    directory: /tools/design-lint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
