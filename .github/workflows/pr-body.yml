# PR-body gates. Separate from ci.yml so that editing the PR body re-runs only
# these jobs and not the whole CI.
#
# Jobs:
#   falsified-by   every new test case needs a `Falsified by:` line in the PR
#                  body naming the mutation that fails it
#                  (scripts/check-falsified-by.py)
#   pr-template    the body keeps every section of
#                  .github/pull_request_template.md, each filled in
#                  (scripts/check-pr-template.py); bot PRs (Dependabot) skip it
#   decision-records  the body's `## Decision records` section names every
#                  decision record the PR changes, and the job log lists the
#                  records whose Rules the diff falls under
#                  (scripts/check-adr-scope.py); bot PRs skip it
#
# The merge queue has no pull request body to read: merge-queue.yml reports
# these job names on the merge_group event.

name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  falsified-by:
    name: falsified-by (PR body)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Falsified by lines
        # The PR body is untrusted text (fork PRs): it reaches the script only
        # through the environment, never through a `${{ }}` expansion in `run:`.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          FALSIFIED_BASE: merge-parent
        run: python3 scripts/check-falsified-by.py

  pr-template:
    name: pr-template (PR body)
    # Dependabot writes its own body; the template is for people and agents.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the PR template sections
        # Untrusted text again: the body reaches the script only through env.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-template.py

  decision-records:
    name: decision-records (PR body)
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the Decision records section
        # Untrusted text: the body reaches the script only through env.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          FALSIFIED_BASE: merge-parent
        run: python3 scripts/check-adr-scope.py
