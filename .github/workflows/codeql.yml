# CodeQL security scanning for the C# / .NET server-side code.
#
# CodeQL supports C# but not Dart, so this analyzes the OpenAstroAra.* and
# related .NET projects only; the Flutter client is covered by `flutter
# analyze` in ci.yml. We use `build-mode: none` so CodeQL extracts directly
# from source without a full `dotnet build` (no CFITSIO / SDK setup needed,
# and it stays green on a vanilla checkout). Results land in the repo's
# Security → Code scanning tab; this workflow does not gate merges.
#
# Path filter (#1022): on pull_request only, prose-only PRs skip the analysis.
# This is a workflow-level `paths-ignore:`, which ci.yml deliberately avoids
# (#1020): a workflow filtered out by paths never creates its check, so a
# REQUIRED context would wait forever. That does not apply here — verified
# 2026-09-20 against the `master protection` ruleset (id 17174314): its rules
# are deletion / non_fast_forward / pull_request / required_status_checks, and
# neither `Analyze (csharp)` nor the code-scanning `CodeQL` check is a
# required context. Code-scanning alerts on the default branch come from the
# unfiltered `push` runs (and the weekly schedule), so PR-level skipping
# leaves the alert history intact. The ignore list mirrors the inert trees
# in scripts/classify-changed-paths.py (INERT_DIRS); a test pins the two.
#
# Actions are pinned to immutable commit SHAs per the repo's zizmor policy.
name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**.md'
  schedule:
    # Weekly catch-all so advisories published after a quiet period still surface.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to code scanning
      contents: read
      actions: read
    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.x pinned per zizmor immutable-ref policy
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: "/language:csharp"
