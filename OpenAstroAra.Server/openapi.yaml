            - string
        size_bytes:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        captured_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        relative_path:
          type:
            - 'null'
            - string
    BackupStreamStatusDto:
      required:
        - enabled
        - active_target
        - pending_count
        - synced_count
        - queue_size_bytes
      type: object
