    delete:
      tags:
        - Profiles
      summary: Delete a profile. Deleting the active profile activates the newest remaining one; deleting the last profile returns to the zero-profile state.
      operationId: DeleteProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/profiles/{id}/select':
    post:
      tags:
