components:
  schemas:
    ApiSurfaceVersionDto:
      required:
        - name
        - version
        - is_deprecated
        - sunset_utc
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        is_deprecated:
          type: boolean
        sunset_utc:
          type:
            - 'null'
            - string
          format: date-time
    ApiVersionsDto:
      required:
        - daemon_version
        - daemon_git_sha
        - dotnet_version
        - os_release
        - os_arch
        - alpaca_sdk_version
        - phd2_protocol_version
        - api_surfaces
      type: object
      properties:
        daemon_version:
          type: string
        daemon_git_sha:
          type: string
        dotnet_version:
          type: string
        os_release:
          type: string
        os_arch:
          type: string
        alpaca_sdk_version:
          type: string
        phd2_protocol_version:
          type: string
        api_surfaces:
          type: array
          items:
            $ref: '#/components/schemas/ApiSurfaceVersionDto'
    AutoFlatsDecisionRequestDto:
      required:
        - choice
        - remember
      type: object
      properties:
        choice:
          type: string
        remember:
          type: boolean
    AutofocusCurveFitDto:
      required:
        - algorithm
        - r_squared
        - best_position
        - predicted_hfr
        - within_sampled_range
        - curve
      type: object
      properties:
        algorithm:
          type: string
        r_squared:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        best_position:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        predicted_hfr:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        within_sampled_range:
          type: boolean
        curve:
          type: array
          items:
            $ref: '#/components/schemas/AutofocusCurvePointDto'
    AutofocusCurvePointDto:
      required:
        - position
        - hfr
      type: object
      properties:
        position:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        hfr:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
    AutofocusProbeDto:
      required:
        - index
        - phase
        - position
        - hfr
        - stars
        - kept
      type: object
      properties:
        index:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        phase:
          type: string
        position:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        hfr:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        stars:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        kept:
          type: boolean
    AutofocusRunDto:
      required:
        - state
        - mode
        - phase
        - trigger
        - started_utc
        - completed_utc
        - duration_seconds
        - start_position
        - final_position
        - final_hfr
        - final_stars
        - filter
        - focuser_temperature_c
        - total_steps
        - completed_steps
        - sweep_attempt
        - step_size
        - step_size_source
        - probes
        - fit
        - reason
        - restored_position
        - has_frame
        - frame_seq
        - frame_position
        - frame_hfr
      type: object
      properties:
        state:
          type: string
        mode:
          type:
            - 'null'
            - string
        phase:
          type:
            - 'null'
            - string
        trigger:
          type:
            - 'null'
            - string
        started_utc:
          type:
            - 'null'
            - string
          format: date-time
        completed_utc:
          type:
            - 'null'
            - string
          format: date-time
        duration_seconds:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - 'null'
            - number
            - string
          format: double
        start_position:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        final_position:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        final_hfr:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - 'null'
            - number
            - string
          format: double
        final_stars:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        filter:
          type:
            - 'null'
            - string
        focuser_temperature_c:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - 'null'
            - number
            - string
          format: double
        total_steps:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        completed_steps:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        sweep_attempt:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        step_size:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        step_size_source:
          type:
            - 'null'
            - string
        probes:
          type: array
          items:
            $ref: '#/components/schemas/AutofocusProbeDto'
        fit:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AutofocusCurveFitDto'
        reason:
          type:
            - 'null'
            - string
        restored_position:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        has_frame:
          type: boolean
        frame_seq:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        frame_position:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        frame_hfr:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - 'null'
            - number
            - string
          format: double
    AutofocusSettingsDto:
      required:
        - method
        - steps
        - step_size
        - exposure_seconds
        - binning
        - af_filter
        - run_after_filter_change
        - trigger_temp_delta_c
        - trigger_hfr_drift_pct
        - every_n_hours
        - abort_sequence_on_af_failure
        - restore_position_on_failure
      type: object
      properties:
        method:
          type: string
        steps:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        step_size:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        exposure_seconds:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        binning:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        af_filter:
          type: string
        run_after_filter_change:
          type: boolean
        trigger_temp_delta_c:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        trigger_hfr_drift_pct:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$'
          type:
            - number
            - string
          format: double
        every_n_hours:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        abort_sequence_on_af_failure:
          type: boolean
        restore_position_on_failure:
          type: boolean
        telescope_type:
          type: string
          default: other
        step_size_auto:
          type: boolean
          default: true
    BackupStreamAckRequestDto:
      required:
        - frame_id
